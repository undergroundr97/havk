<div class="login">
  <!-- Painel à esquerda -->
  <section class="login__panel">
    <p class="login__eyebrow">Bem-vindo de volta</p>

    <div class="login__intro">
      <h1 class="login__title">Entre no<br />HAVK.</h1>
      <p class="login__lead">
        Retome o contexto do seu canal e continue construindo a próxima ideia.
      </p>
    </div>

    <ul class="login__benefits">
      <li class="login__benefit">
        Seu histórico de relatórios
        <svg class="login__check" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 8.5l3 3 7-7" />
        </svg>
      </li>
      <li class="login__benefit">
        Tendências já analisadas
        <svg class="login__check" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 8.5l3 3 7-7" />
        </svg>
      </li>
      <li class="login__benefit">
        Ideias salvas do seu canal
        <svg class="login__check" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 8.5l3 3 7-7" />
        </svg>
      </li>
    </ul>
  </section>

  <!-- Formulário à direita -->
  <section class="login__form-area">
    <form class="login__form">
      <div class="login__field">
        <label class="login__label" for="login-email">E-mail</label>
        <input
          class="login__input"
          id="login-email"
          type="email"
          autocomplete="email"
        />
      </div>

      <div class="login__field">
        <label class="login__label" for="login-senha">Senha</label>
        <input
          class="login__input"
          id="login-senha"
          type="password"
          autocomplete="current-password"
        />
      </div>

      <label class="login__remember">
        <input class="login__checkbox" type="checkbox" />
        <span>Lembrar meu e-mail</span>
      </label>

      <button class="login__btn login__btn--primary" type="submit">
        Entrar
      </button>
    </form>

    <div class="login__divider"><span>ou</span></div>

    <div class="login__oauth">
      <button class="login__btn login__btn--outline" type="button">
        <svg class="login__btn-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.5" y="5" width="19" height="14" rx="4" />
          <path d="M10 9.5v5l4.5-2.5z" />
        </svg>
        Entrar com YouTube
      </button>
      <p class="login__hint">
        Use sua identidade Google e autorize somente a leitura do seu canal.
      </p>
    </div>
  </section>
</div>
